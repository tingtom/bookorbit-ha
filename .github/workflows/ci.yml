name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: pip install pytest pytest-homeassistant-custom-component ruff

      - name: Lint
        run: ruff check custom_components tests conftest.py

      - name: Run tests
        run: pytest -q
